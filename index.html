<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar o Corre</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("./corrida.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.55);
            padding: 45px 30px;
            border-radius: 25px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: white;
            font-size: 34px;
            margin: 0 0 20px 0;
        }

        p {
            color: white;
            font-size: 21px;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        .whatsapp {
            display: inline-block;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 18px 30px;
            border-radius: 50px;
            transition: 0.2s;
        }

        .whatsapp:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CONFIRME O CORRE</h1>

        <p>
            Para confirmar o corre amanhã às 08:00,
            clique abaixo e envie o endereço onde devo te buscar.
        </p>

        <a
            class="whatsapp"
            href="https://wa.me/5511970218569"
            target="_blank">
            📍 ENVIAR MEU ENDEREÇO
        </a>

    </div>

</body>
</html>
